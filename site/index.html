<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-render="profile.title">简历</title>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <noscript>
    <div style="padding:16px;background:#fef3c7;color:#92400e;text-align:center;font-size:14px;font-family:sans-serif;">
      您的浏览器未启用 JavaScript，简历内容仍可正常阅读，但缩放和编辑功能不可用。
    </div>
  </noscript>
  <button type="button" class="menu-button" id="menuBtn" aria-label="打开编辑菜单" title="打开编辑菜单">☰</button>
  <div class="toast-container" id="toastContainer"></div>

  <!-- ponytail: 通用样式配置弹窗 — 各模块 ⚙ 打开, body 由 openStyleModal 动态注入. -->
  <div class="style-modal" id="styleModal" hidden>
    <div class="style-modal-overlay" data-modal-close></div>
    <div class="style-modal-panel" role="dialog" aria-modal="true" aria-labelledby="styleModalTitle">
      <div class="style-modal-head">
        <h3 id="styleModalTitle"></h3>
        <button type="button" class="style-modal-close" data-modal-close aria-label="关闭">×</button>
      </div>
      <div class="style-modal-body" id="styleModalBody"></div>
    </div>
  </div>

  <!-- ponytail: 头像裁剪弹窗 — 编辑器点头像预览打开. 拖拽调位置/滑块缩放/输入选框高 (宽固定 260, 渲染只吃比例),
       状态存 prefs.avatarCrop (视图偏好, 不进数据/导出). 交互全在 editor.js openAvatarCrop. -->
  <div class="style-modal" id="avatarCropModal" hidden>
    <div class="style-modal-overlay" data-modal-close></div>
    <div class="style-modal-panel" role="dialog" aria-modal="true" aria-labelledby="cropModalTitle">
      <div class="style-modal-head">
        <h3 id="cropModalTitle">调整头像</h3>
        <button type="button" class="style-modal-close" data-modal-close aria-label="关闭">×</button>
      </div>
      <div class="style-modal-body">
        <div class="crop-stage"><div class="crop-frame" id="cropFrame"><img id="cropImg" alt="" draggable="false"></div></div>
        <div class="crop-controls">
          <div class="crop-row"><span>形状</span><div class="vis-toggles">
            <label class="vis-toggle"><input type="radio" name="pref.avatarShape" data-vis-pref="avatarShape" value="rounded">圆角</label>
            <label class="vis-toggle"><input type="radio" name="pref.avatarShape" data-vis-pref="avatarShape" value="circle">圆形</label>
            <label class="vis-toggle"><input type="radio" name="pref.avatarShape" data-vis-pref="avatarShape" value="square">直角</label>
            <!-- ponytail: 正方形已从 UI 删除 — 等价于 直角+下方「方形 1:1」; prefs 里的旧 squareBox 值仍兼容 (avatarShapeIsSquare). -->
          </div></div>
          <div class="crop-row"><span>缩放</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1"></div>
          <div class="crop-row">
            <span>选框高</span><input type="number" id="cropFH" min="160" max="560" step="10"> px
            <button type="button" class="editor-btn" data-crop-ratio="5:7">证件照 5:7</button>
            <button type="button" class="editor-btn" data-crop-ratio="1:1">方形 1:1</button>
          </div>
        </div>
        <div class="crop-actions">
          <button type="button" class="editor-btn" id="cropResetBtn">清除裁剪</button>
          <button type="button" class="editor-btn" id="cropSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>
  <div class="page-shell">
    <div class="resume-stage">
      <main class="resume-document" id="resumeDocument" data-js-ready="false">
        <div class="resume-source" id="resumeSource">
          <header class="resume-header">
            <div>
              <h1 data-render="profile.name">姓名</h1>
              <!-- ponytail: 头部两层 — 必备行 (icon+值, 职位/电话/意向城市/经验, 空字段不显示)
                   + 胶囊层 (其余可选字段 + 长值邮箱), 显隐都走 prefs.profileHidden. -->
              <div class="identity-essential" id="identityEssential"></div>
              <div class="identity-line" id="identityLine"></div>
            </div>
            <div class="resume-avatar" data-render="profile.avatar" style="--avatar-image: url('');" aria-hidden="true"></div>
          </header>
        </div>

        <div class="resume-pages" id="resumePages" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <aside class="floating-toolbar" aria-label="简历缩放工具">
    <button type="button" class="tool-button" data-action="zoom-in" aria-label="放大简历">+</button>
    <button type="button" class="tool-button" data-action="zoom-out" aria-label="缩小简历">−</button>
    <button type="button" class="tool-button reset-button" data-action="reset" aria-label="重置简历缩放">100%</button>
  </aside>

  <input type="file" id="fileImportInput" accept=".json,.md,application/json" hidden>

  <div class="editor-panel" id="editorPanel">
    <div class="editor-header">
      <h2>编辑简历</h2>
      <button type="button" class="editor-close" id="closeEditor" aria-label="关闭编辑">×</button>
    </div>
    <div class="editor-content" id="editorContent"></div>
    <div class="editor-footer">
      <div class="dropdown" id="importDropdown">
        <button type="button" class="editor-btn dropdown-toggle" data-dropdown="importDropdown">
          导入 <span class="dropdown-arrow">▾</span>
        </button>
        <div class="dropdown-menu" hidden>
          <button type="button" class="dropdown-item" data-action="import-json">导入 JSON</button>
          <button type="button" class="dropdown-item" data-action="import-md">导入 Markdown</button>
        </div>
      </div>
      <div class="dropdown" id="exportDropdown">
        <button type="button" class="editor-btn dropdown-toggle" data-dropdown="exportDropdown">
          导出 <span class="dropdown-arrow">▾</span>
        </button>
        <div class="dropdown-menu" hidden>
          <button type="button" class="dropdown-item" data-action="export-json">导出 JSON（数据）</button>
          <button type="button" class="dropdown-item" data-action="export-md">导出 Markdown（数据）</button>
          <button type="button" class="dropdown-item" data-action="export-png">导出 PNG（图片，文字不可搜索）</button>
          <button type="button" class="dropdown-item" data-action="print">导出 PDF（浏览器打印，文字可搜索）</button>
        </div>
      </div>
      <button type="button" class="editor-btn" data-action="restore-backup">恢复备份</button>
      <button type="button" class="editor-btn" data-action="copy-errors">复制错误</button>
      <button type="button" class="editor-btn" data-action="reset-data">重置默认</button>
      <button type="button" class="editor-btn primary" id="saveData">保存</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/data.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
